[project]
name = "drift-aware-rag"
version = "0.2.0"
description = "Label-free RAG monitoring via embedding-space geometry"
readme = "README.md"
# Aryan Garg wrote the base pipeline; Aditi Saxena owned the repository this work was
# forked from and ran the first analysis pass. See NOTICE.md for the full provenance.
authors = [
    { name = "Aryan Garg", email = "148696092+Aryan-Garg-dev@users.noreply.github.com" },
    { name = "Aditi Saxena" },
    { name = "Suvidh Jain", email = "suvidh.jain2023@vitstudent.ac.in" },
]
maintainers = [
    { name = "Suvidh Jain", email = "suvidh.jain2023@vitstudent.ac.in" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rag", "drift-detection", "retrieval", "embeddings", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

# Core dependencies are deliberately light. The default pipeline embeds with a pure
# numpy implementation of all-MiniLM-L6-v2 read straight from the safetensors
# checkpoint, searches with an exact numpy index, and evaluates with recall@k, so it
# needs neither torch, nor a vector database, nor an LLM endpoint. Everything that
# does is in the `heavy` extra and imported lazily, so its absence costs nothing.
dependencies = [
    # config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # data
    "pandas>=2.0",
    "pyarrow>=14.0",
    # numerics
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    # CLI and logging
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# The original stack: sentence-transformers embeddings, a Chroma index, RAGAS
# faithfulness, the HuggingFace datasets loader, and an OpenAI-compatible endpoint.
# Selected via EMBED_BACKEND / RETRIEVAL_BACKEND / OPENAI_ENABLED / DATA_SOURCE.
heavy = [
    "torch>=2.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "datasets>=2.20",
    "ragas>=0.2",
    "openai>=1.0",
]
viz = [
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "plotly>=5.20",
]
# research/dar/{stats,theory}.py use POT for exact optimal transport, as the ground
# truth the sliced-W1 estimator is checked against. Only research/ needs it.
research = [
    "pot>=0.9",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
drift-rag = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is a flat collection of top-level packages driven by `main.py`, not a
# single importable module, so the build lists them explicitly. (It previously named a
# `src/drift_aware_rag` module that held only a generated `uv init` stub and none of
# the real code.)
[tool.hatch.build.targets.wheel]
packages = [
    "configs",
    "dashboard",
    "data",
    "drift",
    "embeddings",
    "evaluation",
    "policy",
    "research",
    "retrieval",
    "streaming",
]
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_model: requires the all-MiniLM-L6-v2 checkpoint on disk",
    "slow: takes more than a couple of seconds",
]
# -m "not slow" keeps the default loop fast; CI should run everything.
addopts = "-q"
